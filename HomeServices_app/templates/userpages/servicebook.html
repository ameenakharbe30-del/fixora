{% extends "userpages/user_header_footer.html" %}
{% block content %}
{% load static %}






<div class="container py-5">
    <div class="row">

        <!-- LEFT SIDE -->
        <div class="col-lg-6">

            {% if services.img %}
            <img src="{{ services.img.url }}" 
                 style="width:100%; height:350px; object-fit:cover; border-radius:10px;">
            {% endif %}

            <div class="mt-3">
                <h2>{{ services.Name }}</h2>

                <p>{{ services.Description }}</p>

                <!-- ✅ PRICE -->
                <h4 style="color:#b47b3b;">
                    ₹ {{ services.price }}
                </h4>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="col-lg-6">
            <h2 class="mb-4">Need Help? Book Now</h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Problem Description</label>
                    <textarea class="form-control" name="Problem_Description"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-2">
                        <input type="text" name="House_No" class="form-control" placeholder="House No">
                    </div>

                    <div class="col-md-6 mb-2">
                        <input type="text" name="Address" class="form-control" placeholder="Address">
                    </div>

                    <div class="col-md-6 mb-2">
                        <input type="text" name="contact" class="form-control" placeholder="Mobile">
                    </div>

                    <div class="col-md-6 mb-2">
                        <input type="text" value="{{services.Name}}" class="form-control" readonly>
                        <input type="hidden" name="service" value="{{services.id}}">
                    </div>

                    <div class="col-md-6 mb-2">
                        <select name="city" class="form-control" required>
                            <option value="">Select city</option>
                            {% for c in cities %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 mb-2">
                        <input type="text" name="Pincode" class="form-control" placeholder="Pincode">
                    </div>

                    <div class="col-12 mb-2">
                        <textarea name="landmark" class="form-control" placeholder="Landmark"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2"
        onclick="this.disabled=true; this.innerText='Booking...'; this.form.submit();">
    Submit
</button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
