{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Fixora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Icons & CSS -->
    <link rel="shortcut icon" href="https://i.imgur.com/QRAUqs9.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.0/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pixeden-stroke-7-icon@1.2.3/pe-icon-7-stroke/dist/pe-icon-7-stroke.min.css">
    <link rel="stylesheet" href="{% static 'admin_assets/assets/css/style.css' %}">
</head>
<body>

<!-- Sidebar -->
<aside id="left-panel" class="left-panel soft-sidebar">
    <nav class="navbar navbar-expand-sm navbar-light">
        <div id="main-menu" class="main-menu">
            <ul class="nav navbar-nav">

                <!-- Dashboard -->
                <li class="active">
                    <a href="{% url 'workers_home' %}" class="sidebar-link">
                        <i class="pe-7s-home me-2"></i> Dashboard
                    </a>
                </li>

                <!-- Colleagues -->
                <li class="menu-title">Colleagues</li>
                <li>
                    <a href="{% url 'ViewColleagues' %}" class="sidebar-link">
                        <i class="pe-7s-users me-2"></i> View Colleagues
                    </a>
                </li>

                <!-- Requests -->
                <li class="menu-title">Requests</li>
                <li>
                    <a href="{% url 'WorkerViewRequests' %}" class="sidebar-link">
                        <i class="pe-7s-note2 me-2"></i> All Requests
                    </a>
                </li>
                <li>
                    <a href="{% url 'WorkerpendingTask' %}" class="sidebar-link">
                        <i class="pe-7s-hourglass me-2"></i> Pending Tasks
                    </a>
                </li>

                <!-- Feedback -->
                <li class="menu-title">Feedback</li>
                <li>
                    <a href="{% url 'viewworkerfeedbacks' %}" class="sidebar-link">
                        <i class="pe-7s-mail me-2"></i> Feedbacks
                    </a>
                </li>

            </ul>
        </div>
    </nav>
</aside>

<style>
/* ================= Sidebar ================= */
.soft-sidebar {
    background-color: #000000 !important; /* full black */
    border-right: 1px solid #111111 !important;
    min-height: 100vh;
    box-shadow: 2px 0 5px rgba(0,0,0,0.3);
}

.soft-sidebar .navbar-nav > li > a,
.soft-sidebar .sidebar-link,
.soft-sidebar .nav-link {
    color: #1a0808 !important; /* white text */
    font-weight: 500;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    border-radius: 6px;
    margin: 4px 10px;
}

.soft-sidebar .nav-link:hover,
.soft-sidebar .sidebar-link:hover {
    background-color: #1a1a1a !important; /* hover slightly lighter black */
    color: #ff9900 !important; /* hover accent */
    text-decoration: none;
}

.soft-sidebar .menu-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #cccccc !important; /* light grey title */
    padding: 15px 20px 5px 20px;
    letter-spacing: 1px;
}

.soft-sidebar i {
    color: #ffffff !important; /* icons white */
}

.soft-sidebar li.active > a {
    background-color: #222222 !important; /* active bg */
    color: #ff9900 !important; /* active text accent */
    font-weight: 600;
}

/* ================= Header ================= */
.header {
    background-color: #000000 !important; /* black top header */
    color: #ffffff !important;
    border-bottom: 1px solid #111111;
}

.header a.navbar-brand {
    color: #ffffff !important;
    font-weight: bold;
}

.header .top-right h6 {
    color: #ffffff !important;
}

.header .user-menu .nav-link {
    color: #ffffff !important;
}

.header .user-menu .nav-link:hover {
    background-color: #1a1a1a !important;
    color: #ff9900 !important;
}

/* ================= Footer ================= */
.site-footer {
    background-color: #000000 !important;
    color: #ffffff !important;
    border-top: 1px solid #111111;
}

/* Optional: Scrollbar for sidebar */
.soft-sidebar::-webkit-scrollbar {
    width: 6px;
}

.soft-sidebar::-webkit-scrollbar-thumb {
    background-color: #444;
    border-radius: 3px;
}
</style>





<!-- /#left-panel -->

<!-- Right Panel -->
<div id="right-panel" class="right-panel">

    <!-- Header -->
    <header id="header" class="header d-flex justify-content-between align-items-center px-3">
        <div class="top-left d-flex align-items-center">
            <a class="navbar-brand" href="{% url 'workers_home' %}">Fixora</a>
            <a id="menuToggle" class="menutoggle ms-3"><i class="fa fa-bars"></i></a>
        </div>

        <div class="top-right d-flex align-items-center">
            <div class="user-area dropdown">
                <a href="#" class="dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <h6>{{ request.user }}</h6>
                </a>
                <div class="user-menu dropdown-menu">
                    <a class="nav-link" href="{% url 'workerprofile' %}"><i class="fa fa-user"></i> My Profile</a>
                    <a class="nav-link" href="{% url 'logout' %}"><i class="fa fa-power-off"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>
    <!-- /#header -->

    {% block content %}
    {% endblock %}

    <div class="clearfix"></div>

    <!-- Footer -->
    <footer class="site-footer py-3 bg-white text-center">
        <div class="row">
            <div class="col-12">
                &copy; 2026 Fixora
            </div>
        </div>
    </footer>
    <!-- /#footer -->

</div>
<!-- /#right-panel -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.4/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
<script src="{% static 'admin_assets/assets/js/main.js' %}"></script>

</body>
</html>
