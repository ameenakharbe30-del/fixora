{% extends 'workerpages/base.html' %}
{% block content %}



<h2>Edit Profile</h2>


<form method="POST" enctype="multipart/form-data" action="{% url 'worker_edit_profile' %}">
  {% csrf_token %}
  
  <label>First Name:</label>
  <input type="text" name="first_name" value="{{ data.admin.first_name }}" required><br><br>

  <label>Last Name:</label>
  <input type="text" name="last_name" value="{{ data.admin.last_name }}" required><br><br>

  <label>Email:</label>
  <input type="email" name="email" value="{{ data.admin.email }}" required><br><br>

  <label>Contact Number:</label>
  <input type="text" name="contact_number" value="{{ data.contact_number }}"><br><br>

  <label>Address:</label>
  <input type="text" name="address" value="{{ data.address }}"><br><br>

  <label>Gender:</label>
  <select name="gender">
    <option value="Male" {% if data.gender=="Male" %}selected{% endif %}>Male</option>
    <option value="Female" {% if data.gender=="Female" %}selected{% endif %}>Female</option>
  </select><br><br>

  <label>Profile Picture:</label>
  <input type="file" name="profile_pic"><br><br>

  <button type="submit">Save Changes</button>
</form>

{% endblock %}
